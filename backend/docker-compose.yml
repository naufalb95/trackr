services:
  postgres:
    image: postgres:18-alpine
    command: -c fsync=off
    platform: linux/arm64/v8
    env_file:
      - .env
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user"]
      interval: 5s
  migrate:
    image: migrate/migrate
    volumes:
      - ./migrations:/migrations
    env_file:
      - .env
    command: [
      "-path", "/migrations",
      "-database", "postgres://${POSTGRES_USERNAME}:${POSTGRES_PASSWORD}@postgres:${DATABASE_PORT}/${POSTGRES_DB}?sslmode=${POSTGRES_SSLMODE}",
      "up"
    ]
    depends_on:
      postgres:
        condition: service_healthy